<svg width="512" height="512" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c81;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Gradient for airplane -->
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>

    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="70" cy="70" r="68" fill="url(#bgGradient)"/>
  <circle cx="70" cy="70" r="68" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Stylized airplane with motion trails -->
  <g transform="translate(30, 35)">
    <!-- Motion trails -->
    <path d="M 0 25 Q 15 23, 30 25" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 5 30 Q 18 28, 32 30" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 3 35 Q 16 33, 29 35" stroke="rgba(251, 191, 36, 0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Main airplane body -->
    <g transform="rotate(-8, 50, 30)">
      <!-- Fuselage -->
      <ellipse cx="55" cy="30" rx="28" ry="6" fill="url(#planeGradient)"/>
      
      <!-- Wings -->
      <path d="M 40 30 L 30 22 L 35 30 L 30 38 L 40 30 Z" fill="#fbbf24"/>
      <path d="M 70 30 L 80 25 L 75 30 L 80 35 L 70 30 Z" fill="#f59e0b"/>
      
      <!-- Tail -->
      <path d="M 27 30 L 22 26 L 25 30 L 22 34 L 27 30 Z" fill="#fbbf24"/>

      <!-- Windows -->
      <circle cx="45" cy="30" r="1.5" fill="#0f4c81" opacity="0.6"/>
      <circle cx="50" cy="30" r="1.5" fill="#0f4c81" opacity="0.6"/>
      <circle cx="55" cy="30" r="1.5" fill="#0f4c81" opacity="0.6"/>
      <circle cx="60" cy="30" r="1.5" fill="#0f4c81" opacity="0.6"/>
    </g>
  </g>

  <!-- Globe element -->
  <circle cx="70" cy="70" r="50" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <ellipse cx="70" cy="70" rx="25" ry="50" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>
  <line x1="20" y1="70" x2="120" y2="70" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- FlyMo text -->
  <text x="70" y="88" font-family="'Inter', 'Arial', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FlyMo</text>

  <!-- Tours text -->
  <text x="70" y="105" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="url(#textGradient)" text-anchor="middle" letter-spacing="1.5">TOURS</text>

  <!-- by SK Ventures - smaller subtitle -->
  <text x="70" y="118" font-family="'Inter', 'Arial', sans-serif" font-size="7" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="0.5" font-style="italic">by SK Ventures</text>

  <!-- Decorative arc below -->
  <path d="M 40 120 Q 70 123, 100 120" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
