<svg width="1024" height="1024" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c81;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Gradient for airplane -->
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>

    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="70" cy="70" r="68" fill="url(#bgGradient)"/>
  <circle cx="70" cy="70" r="68" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Modern airplane with motion trails - Flaticon style -->
  <g transform="translate(30, 35)">
    <!-- Motion trails -->
    <path d="M 5 15 Q 15 14, 25 15" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 8 20 Q 17 19, 27 20" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 6 25 Q 16 24, 26 25" stroke="rgba(251, 191, 36, 0.2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Modern airplane icon - clean Flaticon style -->
    <g transform="translate(35, 20) rotate(-12, 25, 0)">
      <!-- Main body/fuselage -->
      <path d="M 0 0 L 40 0 L 45 -2 L 48 0 L 45 2 L 40 0 L 0 0 Z" fill="url(#planeGradient)"/>
      
      <!-- Main wings -->
      <path d="M 15 0 L 8 -12 L 12 -12 L 22 0 L 12 12 L 8 12 Z" fill="#fbbf24"/>
      
      <!-- Tail wings -->
      <path d="M 2 0 L 0 -8 L 3 -8 L 6 0 Z" fill="#fbbf24" opacity="0.9"/>
      <path d="M 2 0 L 0 8 L 3 8 L 6 0 Z" fill="#fbbf24" opacity="0.9"/>
      
      <!-- Vertical tail -->
      <path d="M 3 0 L 0 -6 L 2 -5 L 5 0 Z" fill="#f59e0b"/>
      
      <!-- Windows on fuselage -->
      <circle cx="20" cy="0" r="1.2" fill="#0f4c81" opacity="0.6"/>
      <circle cx="25" cy="0" r="1.2" fill="#0f4c81" opacity="0.6"/>
      <circle cx="30" cy="0" r="1.2" fill="#0f4c81" opacity="0.6"/>
      <circle cx="35" cy="0" r="1.2" fill="#0f4c81" opacity="0.6"/>
      
      <!-- Nose highlight -->
      <ellipse cx="47" cy="0" rx="2" ry="1.5" fill="#fbbf24" opacity="0.8"/>
    </g>
  </g>

  <!-- Globe element -->
  <circle cx="70" cy="70" r="50" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <ellipse cx="70" cy="70" rx="25" ry="50" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>
  <line x1="20" y1="70" x2="120" y2="70" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- FlyMo text -->
  <text x="70" y="88" font-family="'Inter', 'Arial', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FlyMo</text>

  <!-- Tours text -->
  <text x="70" y="105" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="url(#textGradient)" text-anchor="middle" letter-spacing="1.5">TOURS</text>

  <!-- by SK Ventures - smaller subtitle -->
  <text x="70" y="118" font-family="'Brush Script MT', 'Lucida Handwriting', 'Segoe Script', cursive" font-size="11" font-weight="600" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="0.3" font-style="italic">by SK Ventures</text>

  <!-- Decorative arc below -->
  <path d="M 40 120 Q 70 123, 100 120" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
