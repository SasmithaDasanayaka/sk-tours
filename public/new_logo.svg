<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#1a365d" stroke="#f6ad55" stroke-width="3"/>
  
  <!-- Globe lines -->
  <ellipse cx="60" cy="60" rx="38" ry="38" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/>
  <ellipse cx="60" cy="60" rx="20" ry="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <line x1="22" y1="60" x2="98" y2="60" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Airplane silhouette -->
  <g transform="translate(78, 22) rotate(35)" opacity="0.35">
    <path d="M0 0 L-6 3 L-18 -1 L-6 1 L-18 5 L-6 3 L0 6 L2 3 Z" fill="#f6ad55"/>
  </g>
  
  <!-- "S" letter -->
  <text x="36" y="74" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">S</text>
  
  <!-- "K" letter -->
  <text x="66" y="74" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="700" fill="#f6ad55" letter-spacing="-1">K</text>
  
  <!-- "Ventures" text in cursive below SK -->
  <defs>
    <linearGradient id="toursGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f6ad55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbd38d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text 
    x="60" 
    y="92" 
    font-family="'Brush Script MT', 'Lucida Handwriting', cursive" 
    font-size="18" 
    font-style="italic"
    fill="url(#toursGradient)" 
    text-anchor="middle"
    letter-spacing="1">
    Ventures
  </text>
  <!-- Decorative underline swash -->
  <path 
    d="M 35 93 Q 60 96, 85 93" 
    stroke="#f6ad55" 
    stroke-width="0.8" 
    fill="none" 
    opacity="0.5"
    stroke-linecap="round"/>
</svg>
